# Release truth gate.
#
# This workflow is the CI surface of the production-readiness audit
#
# It runs two jobs on every PR and on every push to `main`:
#
# * `truth-gate` — the focused production assertions.
# * `regression` — the complete pytest suite.
#
# Both jobs delegate to the same script (`scripts/run_truth_gate.sh`)
# so operators can reproduce CI locally with:
#
#   bash scripts/run_truth_gate.sh          # full gate
#   bash scripts/run_truth_gate.sh --quick  # truth-gates only
#
# Any green CI run on this workflow proves that, as of that commit, the
# outward-facing surfaces still match the runtime they describe.

name: truth-gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  truth-gate:
    name: truth gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Check agent runtime imports and names
        run: >-
          ruff check --select F
          nerya/agent nerya/api nerya/subagents nerya/teams nerya/tools

      - name: Build and verify distributions
        run: |
          uv build --no-sources --clear
          python scripts/verify_distribution.py dist

      - name: Run + truth gates (quick)
        run: bash scripts/run_truth_gate.sh --quick

  regression:
    name: full regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + dev + trading extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,trading]'

      - name: Run full regression
        run: bash scripts/run_truth_gate.sh
