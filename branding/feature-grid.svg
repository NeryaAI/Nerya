<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Nerya feature highlights">
  <title>Nerya — six pillars</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0a1e"/>
      <stop offset="100%" stop-color="#1a0f3a"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f0a1e" stop-opacity="0"/>
    </radialGradient>

    <!-- Per-card gradients (gel/glass look) -->
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b48bff"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>

    <!-- Card gel sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="off" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Icon halo -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#ambient)"/>

  <!-- Header strip -->
  <g font-family="'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif" fill="#ffffff">
    <text x="64" y="60" font-size="13" letter-spacing="6" fill="#b48bff" font-weight="600">NERYA · CORE PILLARS</text>
    <text x="64" y="108" font-size="38" font-weight="600" letter-spacing="-0.5">Six things every other agent framework wishes it had.</text>
    <text x="64" y="142" font-size="15" fill="#9ca3b8" font-weight="400">Trading-native, skill-first, self-evolving — all in one local runtime.</text>
  </g>

  <!-- Card geometry: 3 cols × 2 rows -->
  <!-- Box: 384w × 234h, gap 16, start x=64 y=190 -->

  <!-- Card 1: Agent Team -->
  <g transform="translate(64,190)" filter="url(#card-shadow)">
    <rect width="384" height="234" rx="20" fill="url(#g1)" opacity="0.95"/>
    <rect width="384" height="234" rx="20" fill="url(#sheen)"/>
    <rect width="384" height="234" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- Icon: nodes + lines (team) -->
    <g transform="translate(28,28)">
      <circle r="34" cx="22" cy="22" fill="url(#halo)"/>
      <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M8 36 L22 14 L36 36"/>
        <path d="M8 36 L36 36"/>
      </g>
      <g fill="#ffffff">
        <circle cx="8" cy="36" r="3.6"/>
        <circle cx="22" cy="14" r="3.6"/>
        <circle cx="36" cy="36" r="3.6"/>
      </g>
    </g>
    <text x="28" y="116" font-family="'Inter',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Agent Team</text>
    <text x="28" y="146" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#f5edff" opacity="0.92">Durable team with leader, analysts, risk critic.</text>
    <text x="28" y="166" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#f5edff" opacity="0.92">Shared blackboard · mailbox · task board · gates.</text>
    <text x="28" y="206" font-family="'JetBrains Mono','SF Mono',monospace" font-size="11" fill="#ffffff" opacity="0.7">market_analysis · strategy_design · trade_decision</text>
  </g>

  <!-- Card 2: Self-Evolution -->
  <g transform="translate(464,190)" filter="url(#card-shadow)">
    <rect width="384" height="234" rx="20" fill="url(#g2)" opacity="0.95"/>
    <rect width="384" height="234" rx="20" fill="url(#sheen)"/>
    <rect width="384" height="234" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- Icon: feedback loop with pulse -->
    <g transform="translate(28,28)">
      <circle r="34" cx="22" cy="22" fill="url(#halo)"/>
      <g stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none">
        <path d="M22 4 A18 18 0 1 1 4 22"/>
        <path d="M4 22 L10 16"/>
        <path d="M4 22 L10 28"/>
      </g>
      <circle cx="22" cy="22" r="3" fill="#ffffff"/>
    </g>
    <text x="28" y="116" font-family="'Inter',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Self-Evolution</text>
    <text x="28" y="146" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#e5fbff" opacity="0.95">Reflection → typed proposal → signed apply → rollback.</text>
    <text x="28" y="166" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#e5fbff" opacity="0.95">Never touches limits.yml or live_trading_enabled.</text>
    <text x="28" y="206" font-family="'JetBrains Mono','SF Mono',monospace" font-size="11" fill="#ffffff" opacity="0.75">prompt · script · skill · route · strategy · learning</text>
  </g>

  <!-- Card 3: Memory -->
  <g transform="translate(864,190)" filter="url(#card-shadow)">
    <rect width="384" height="234" rx="20" fill="url(#g3)" opacity="0.95"/>
    <rect width="384" height="234" rx="20" fill="url(#sheen)"/>
    <rect width="384" height="234" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- Icon: layered docs -->
    <g transform="translate(26,26)">
      <circle r="34" cx="22" cy="22" fill="url(#halo)"/>
      <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round">
        <rect x="6" y="14" width="22" height="22" rx="2"/>
        <rect x="11" y="9" width="22" height="22" rx="2"/>
        <path d="M16 18 L29 18 M16 24 L29 24 M16 30 L25 30" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>
    <text x="28" y="116" font-family="'Inter',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Typed Memory</text>
    <text x="28" y="146" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#fff0f8" opacity="0.95">5 typed markdown surfaces, all auditable and diff-able.</text>
    <text x="28" y="166" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#fff0f8" opacity="0.95">Optional vector recall (memsearch / agentmemory).</text>
    <text x="28" y="206" font-family="'JetBrains Mono','SF Mono',monospace" font-size="11" fill="#ffffff" opacity="0.75">global · mistakes · regimes · skills · per-strategy</text>
  </g>

  <!-- Card 4: Skills -->
  <g transform="translate(64,440)" filter="url(#card-shadow)">
    <rect width="384" height="234" rx="20" fill="url(#g4)" opacity="0.95"/>
    <rect width="384" height="234" rx="20" fill="url(#sheen)"/>
    <rect width="384" height="234" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- Icon: book / SKILL.md -->
    <g transform="translate(26,26)">
      <circle r="34" cx="22" cy="22" fill="url(#halo)"/>
      <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round">
        <path d="M8 10 L26 10 L34 14 L34 36 L26 32 L8 32 Z"/>
        <path d="M26 10 L26 32"/>
        <path d="M14 18 L22 18 M14 23 L22 23" stroke-width="1.8" stroke-linecap="round"/>
      </g>
    </g>
    <text x="28" y="116" font-family="'Inter',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">SKILL.md First</text>
    <text x="28" y="146" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#ecfdf5" opacity="0.95">20+ built-in skills. SKILL.md + scripts/ + references/.</text>
    <text x="28" y="166" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#ecfdf5" opacity="0.95">Install from GitHub URL, folder, or archive.</text>
    <text x="28" y="206" font-family="'JetBrains Mono','SF Mono',monospace" font-size="11" fill="#ffffff" opacity="0.75">market_data · trading · strategy_author · evolution …</text>
  </g>

  <!-- Card 5: Trading Kernel -->
  <g transform="translate(464,440)" filter="url(#card-shadow)">
    <rect width="384" height="234" rx="20" fill="url(#g5)" opacity="0.95"/>
    <rect width="384" height="234" rx="20" fill="url(#sheen)"/>
    <rect width="384" height="234" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- Icon: shield -->
    <g transform="translate(26,26)">
      <circle r="34" cx="22" cy="22" fill="url(#halo)"/>
      <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round">
        <path d="M22 6 L36 12 L36 24 C36 30 30 36 22 38 C14 36 8 30 8 24 L8 12 Z"/>
        <path d="M16 22 L21 27 L30 17" stroke-width="2.4" stroke-linecap="round"/>
      </g>
    </g>
    <text x="28" y="116" font-family="'Inter',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Trading Kernel</text>
    <text x="28" y="146" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#fffbeb" opacity="0.95">Risk Gate + Approval Gate + paper/live separation.</text>
    <text x="28" y="166" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#fffbeb" opacity="0.95">Virtual ledger · positions · PnL · reconciliation.</text>
    <text x="28" y="206" font-family="'JetBrains Mono','SF Mono',monospace" font-size="11" fill="#ffffff" opacity="0.75">Binance · Bybit · OKX · Hyperliquid · BSC · Solana</text>
  </g>

  <!-- Card 6: SDK / Gateway -->
  <g transform="translate(864,440)" filter="url(#card-shadow)">
    <rect width="384" height="234" rx="20" fill="url(#g6)" opacity="0.95"/>
    <rect width="384" height="234" rx="20" fill="url(#sheen)"/>
    <rect width="384" height="234" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- Icon: code brackets + nodes -->
    <g transform="translate(26,26)">
      <circle r="34" cx="22" cy="22" fill="url(#halo)"/>
      <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 10 L6 22 L14 34"/>
        <path d="M30 10 L38 22 L30 34"/>
        <path d="M26 8 L18 38" stroke-width="2"/>
      </g>
    </g>
    <text x="28" y="116" font-family="'Inter',-apple-system,sans-serif" font-size="22" font-weight="700" fill="#ffffff">SDK + Gateway</text>
    <text x="28" y="146" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#eff6ff" opacity="0.95">Python + TypeScript SDK · MCP · ACP bridges.</text>
    <text x="28" y="166" font-family="'Inter',-apple-system,sans-serif" font-size="13" fill="#eff6ff" opacity="0.95">One gateway contract for every chat platform.</text>
    <text x="28" y="206" font-family="'JetBrains Mono','SF Mono',monospace" font-size="11" fill="#ffffff" opacity="0.75">Telegram · Discord · Slack · Feishu · WeCom · Webhook</text>
  </g>

  <!-- Footer hairline -->
  <rect x="64" y="694" width="1152" height="1" fill="#ffffff" opacity="0.06"/>
  <text x="64" y="710" font-family="'JetBrains Mono','SF Mono',monospace" font-size="10" letter-spacing="3" fill="#ffffff" opacity="0.4">NERYA · EVOLUTIONARY BRAIN · VIOLET × CYAN</text>
</svg>
