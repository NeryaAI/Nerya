version: 1
id: default
description: >
  Default Nerya workspace prompt bundle. Ships with `nerya init` and seeds
  the `agents/` and `subagents/` directories of a fresh workspace. Each
  prompt is its own ``.md`` file under this directory so operators can
  diff/upgrade them without editing Python source.
