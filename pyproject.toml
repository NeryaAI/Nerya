[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerya"
version = "0.1.0"
description = "Skill-first, trading-native, self-evolving autonomous agent runtime"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nerya" }]
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "cryptography>=41.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jsonschema>=4.21",
    "trafilatura>=1.8",
    "markdownify>=0.11",
    # Scientific stack used by the in-process backtest engine and
    # indicator math: the backtest loads a strategy's main.py in this
    # interpreter, and generated strategies routinely ``import numpy`` /
    # ``import pandas``. Declaring them here keeps `uv sync` (the
    # installer path) from omitting them, which otherwise surfaces as
    # "backtest failed: ModuleNotFoundError: No module named 'numpy'".
    "numpy>=1.26",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
trading = [
    "ccxt>=4.4",
    "eth-account>=0.13",
    "eth-abi>=5.0",
    "msgpack>=1.0",
    "pynacl>=1.5",
    "base58>=2.1",
]

[project.scripts]
nerya = "nerya.cli.app:main"

[tool.setuptools.packages.find]
where = [".", "sdk/python"]
include = ["nerya*", "nerya_sdk*"]
exclude = ["tests*", "dashboard*", "workspace_template*", "sdk.typescript*"]

[tool.setuptools.package-data]
nerya = [
    "agent/route_manifest_presets/*.yml",
    "skills/builtin/**/*.md",
    "skills/builtin/**/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sdk/python"]
# Default to the curated smoke suite (~50 cases) so local
# `pytest` runs are fast. Run the full 1900+ test regression
# pass via `pytest -m ""` (empty filter selects everything).
addopts = "-m smoke"
markers = [
    "smoke: curated end-to-end smoke suite (default)",
    "integration: opt-in checks that may touch real external services",
    "profile: per-profile gate (unit_mock | strict_runtime | live_opt_in)",
]
